<!doctype html>
<html lang="gu"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><meta name="theme-color" content="#101722"><title>Maru Ghar | Admin</title>
<style>
:root{color-scheme:dark;--bg:#101722;--panel:#192330;--gold:#e5c16b;--silver:#c7ced8;--muted:#aeb8c6}*{box-sizing:border-box}body{margin:0;background:radial-gradient(ellipse at top,#253343,#101722 62%);color:#f5f6f8;font:16px system-ui,-apple-system,Segoe UI,sans-serif;min-height:100vh}.wrap{max-width:1000px;margin:auto;padding:22px}.head{display:flex;align-items:center;gap:14px;border-bottom:1px solid #ffffff20;padding-bottom:18px;margin-bottom:22px}.head img{width:62px;height:62px;object-fit:contain}.head h1{margin:0;color:var(--gold);font-size:clamp(22px,4vw,32px)}.head p{margin:4px 0 0;color:var(--silver)}.panel,.card{background:#182330eF;border:1px solid #d8b86a55;border-radius:18px;padding:20px;margin-bottom:16px;box-shadow:0 12px 35px #0003}.row{display:flex;gap:10px;flex-wrap:wrap}input{width:100%;padding:13px;border:1px solid #5b6878;border-radius:10px;background:#0f1721;color:#fff;margin:6px 0 12px}label{display:block;color:var(--silver)}button{border:0;border-radius:10px;padding:11px 15px;font-weight:700;cursor:pointer}.primary{background:linear-gradient(120deg,#f0d98b,#bd8b35);color:#231a0b}.approve{background:#1f8b61;color:#fff}.reject{background:#a33c46;color:#fff}.muted{color:var(--muted)}.status{white-space:pre-wrap;margin-top:12px;color:var(--gold)}.pill{display:inline-block;border:1px solid #c7a653;border-radius:20px;padding:4px 10px;color:var(--gold);font-size:13px}.photo{width:100%;max-height:260px;object-fit:cover;border-radius:12px;margin:10px 0}.actions{display:flex;gap:9px;flex-wrap:wrap;margin-top:12px}.hidden{display:none!important}a{color:var(--gold)}</style></head>
<body><div class="wrap"><header class="head"><img src="assets/maru-ghar-logo.svg" alt="Maru Ghar logo"><div><h1>મારું ઘર — Admin Panel</h1><p>ગાંધીનગર પ્રોપર્ટી લિસ્ટિંગ મંજૂરી</p></div></header>
<section id="login" class="panel"><h2>એડમિન લોગિન</h2><p class="muted">તમારા Firebase Email/Password એડમિન એકાઉન્ટથી પ્રવેશ કરો.</p><form id="loginForm"><label>ઈમેલ<input id="email" type="email" autocomplete="username" required></label><label>પાસવર્ડ<input id="password" type="password" autocomplete="current-password" required></label><button class="primary" type="submit">સુરક્ષિત લોગિન</button></form><div id="loginStatus" class="status" role="status"></div></section>
<section id="dashboard" class="hidden"><div class="panel row" style="justify-content:space-between;align-items:center"><div><h2 style="margin:0">મંજૂરી બાકી લિસ્ટિંગ</h2><p class="muted">મંજૂર કર્યા પછી જ જાહેર વેબસાઇટ અને એપમાં દેખાશે.</p></div><div class="row"><button id="refresh" class="primary">ફરી લોડ કરો</button><button id="logout">લોગઆઉટ</button></div></div><div id="listings"></div><div id="dashStatus" class="status" role="status"></div></section>
</div>
<script type="module">
import { firebaseConfig } from './firebase-config.js';
import { initializeApp } from 'https://www.gstatic.com/firebasejs/10.14.1/firebase-app.js';
import { getAuth, signInWithEmailAndPassword, signOut, onAuthStateChanged } from 'https://www.gstatic.com/firebasejs/10.14.1/firebase-auth.js';
import { getFirestore, collection, getDocs, query, where, orderBy, updateDoc, deleteDoc, doc, serverTimestamp } from 'https://www.gstatic.com/firebasejs/10.14.1/firebase-firestore.js';
const ADMIN_UID='yJYiuaUE3KXVLVuWqLyLRH5owQJ3';
const app=initializeApp(firebaseConfig), auth=getAuth(app), db=getFirestore(app);
const $=id=>document.getElementById(id); const esc=s=>String(s??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
$('loginForm').addEventListener('submit',async e=>{e.preventDefault();$('loginStatus').textContent='લોગિન ચકાસાઈ રહ્યો છે…';try{await signInWithEmailAndPassword(auth,$('email').value.trim(),$('password').value)}catch(err){$('loginStatus').textContent='લોગિન નિષ્ફળ: '+err.message}});
onAuthStateChanged(auth,async user=>{if(!user){$('login').classList.remove('hidden');$('dashboard').classList.add('hidden');return}if(user.uid!==ADMIN_UID){await signOut(auth);$('loginStatus').textContent='આ એકાઉન્ટને એડમિન મંજૂરી નથી.';return}$('login').classList.add('hidden');$('dashboard').classList.remove('hidden');await loadListings()});
async function loadListings(){ $('dashStatus').textContent='લિસ્ટિંગ લોડ થઈ રહી છે…';$('listings').replaceChildren();try{const snap=await getDocs(query(collection(db,'listings'),where('status','==','pending')));if(snap.empty){$('dashStatus').textContent='હાલ કોઈ પેન્ડિંગ લિસ્ટિંગ નથી.';return}$('dashStatus').textContent=`${snap.size} લિસ્ટિંગ મંજૂરી માટે છે.`;for(const d of snap.docs){const p=d.data(),el=document.createElement('article');el.className='card';const photos=Array.isArray(p.photos)?p.photos:[];el.innerHTML=`<span class="pill">મંજૂરી બાકી</span><h3>${esc(p.type)} — ${esc(p.purpose)}</h3><p><b>માલિક:</b> ${esc(p.ownerName)} &nbsp; <b>ફોન:</b> ${esc(p.ownerPhone)}</p><p><b>વિસ્તાર:</b> ${esc(p.location)}<br><b>કિંમત/ભાડું:</b> ${esc(p.price||'સંપર્ક કરો')}<br><b>વિગત:</b> ${esc(p.description||'—')}</p>${photos.map(ph=>`<img class="photo" src="${esc(ph.url)}" alt="પ્રોપર્ટી ફોટો" loading="lazy">`).join('')}<div class="actions"><button class="approve" data-action="approve">મંજૂર કરો</button><button class="reject" data-action="reject">નામંજૂર કરો</button><button data-action="delete">કાઢી નાખો</button></div>`;el.querySelectorAll('button').forEach(b=>b.addEventListener('click',()=>review(d.id,b.dataset.action,b)));$('listings').appendChild(el)}}catch(e){$('dashStatus').textContent='લિસ્ટિંગ લોડ ન થઈ: '+e.message}}
async function review(id,action,button){if(action==='delete'&&!confirm('આ લિસ્ટિંગ કાયમ માટે કાઢી નાખવી છે?'))return;button.disabled=true;try{if(action==='delete')await deleteDoc(doc(db,'listings',id));else await updateDoc(doc(db,'listings',id),{status:action==='approve'?'approved':'rejected',reviewedAt:serverTimestamp(),reviewedBy:auth.currentUser.uid});await loadListings()}catch(e){$('dashStatus').textContent='ફેરફાર નિષ્ફળ: '+e.message;button.disabled=false}}
$('refresh').addEventListener('click',loadListings);$('logout').addEventListener('click',()=>signOut(auth));
</script></body></html>
