name: Build Maru Ghar Android APK

on:
  workflow_dispatch:
  push:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: maru-ghar-android-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build-apk:
    runs-on: ubuntu-latest
    timeout-minutes: 30

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Setup Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17
          cache: gradle

      - name: Arrange root-level assets
        run: |
          mkdir -p assets

          for f in \
            icon.png \
            maru-ghar-approved-app-icon.png \
            maru-ghar-backend.js \
            maru-ghar-logo.svg \
            splash.png
          do
            if [ -f "$f" ]; then
              cp -f "$f" "assets/$f"
            fi
          done

      - name: Check project files and JavaScript syntax
        run: |
          set -eu

          test -s index.html
          test -s admin.html
          test -s firebase-config.js
          test -s firestore.rules
          test -s package.json

          test -s assets/maru-ghar-logo.svg
          test -s assets/maru-ghar-backend.js
          test -s assets/icon.png
          test -s assets/maru-ghar-approved-app-icon.png
          test -s assets/splash.png

          node -e "const fs=require('fs');const h=fs.readFileSync('index.html','utf8');const m=h.match(/<script>([\s\S]*?)<\/script>/);if(!m)process.exit(1);new Function(m[1]);"

          node --input-type=module --check < assets/maru-ghar-backend.js

          node --input-type=module --check < firebase-config.js

          node -e "const fs=require('fs');const h=fs.readFileSync('admin.html','utf8');const m=h.match(/<script type=\"module\">([\s\S]*?)<\/script>/);if(!m)process.exit(1);fs.writeFileSync('/tmp/admin-module-check.mjs',m[1]);"

          node --check /tmp/admin-module-check.mjs

      - name: Install dependencies and prepare web assets
        run: |
          npm install --no-audit --no-fund
          npm run copy-web

      - name: Generate Android project
        run: |
          npx cap add android
          npx capacitor-assets generate --android
          npx cap sync android

      - name: Build debug APK
        run: |
          cd android
          chmod +x gradlew
          ./gradlew --no-daemon assembleDebug

      - name: Upload APK artifact
        uses: actions/upload-artifact@v4
        with:
          name: MARU-GHAR-ANDROID-APK
          path: android/app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error
          retention-days: 14

      - name: Upload build diagnostics on failure
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: MARU-GHAR-BUILD-DIAGNOSTICS
          path: |
            android/**/*.log
            android/app/build/reports/**
          if-no-files-found: ignore
          retention-days: 7
